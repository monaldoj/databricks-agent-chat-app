bundle:
  name: databricks-agent-chat-app-v2

# The chat UI is vendored under e2e-chatbot-app-next/ and rebuilt in the app
# container by `start-app`, so its installed and compiled output stays local.
# ui-branding/ is gitignored so logos stay off git; include it so a deploy
# from this machine still ships the local greeting override.
sync:
  include:
    - ui-branding
  exclude:
    - "**/node_modules"
    - "**/dist"
    - "**/.venv"
    - "**/test-results"
    - "**/__pycache__"

variables:
  app_name:
    description: |
      Workspace-unique Databricks app name. `uv run setup-mlflow-experiment` pins it
      (see its --app-name flag); BUNDLE_VAR_app_name overrides a single deploy.
      New app names should use the agent- prefix.
    default: "agent-web-search-genie-${bundle.target}"

  experiment_id:
    description: |
      Existing UC-backed MLflow experiment id. Run `uv run setup-mlflow-experiment`
      before deploying; it writes this target's local bundle override.

  trace_catalog:
    description: Unity Catalog catalog containing the experiment trace tables.

  trace_schema:
    description: Unity Catalog schema containing the experiment trace tables.

  trace_table_prefix:
    description: Prefix shared by the experiment's four OTEL trace tables.

  sql_warehouse_id:
    description: SQL warehouse used to create and query the UC trace tables.

  agent_model:
    description: |
      Optional three-level Unity Catalog model name for the deployed agent, such as
      system.ai.claude-opus-5. `uv run setup-mlflow-experiment --agent-model <name>`
      pins it across deploys; BUNDLE_VAR_agent_model overrides a single deploy. The
      whitespace default is normalized to no override — the agent then runs the model
      named in agent_server/agent.py — while remaining valid for the Apps API.
    default: " "

  genie_space_ids:
    description: |
      Optional comma-separated Genie space ids. The agent accesses them on behalf
      of the signed-in user, so no app service-principal resource binding is needed.
      Override with BUNDLE_VAR_genie_space_ids. The whitespace default is normalized
      to no ids for web-search-only deployments while remaining valid for the Apps API.
    default: " "

  ai_search_indexes:
    description: |
      Optional comma-separated AI Search (vector search) index names, each a
      three-level catalog.schema.index. Attached as managed-MCP tools the agent
      calls on behalf of the signed-in user (needs the ai-search user API scope
      below, plus SELECT on the index), so no app service-principal binding is
      needed. Override with BUNDLE_VAR_ai_search_indexes. The whitespace default is
      normalized to no indexes while remaining valid for the Apps API.
    default: " "

  lakebase_project_id:
    description: |
      Lakebase Autoscaling project id that holds persistent agent memory. Unset, the
      deploy uses (and creates if needed) the project named after the app. Deleting a
      project reserves that id until it is purged a week later, so re-run
      `uv run setup-mlflow-experiment` after a deletion: it pins a timestamped id here
      rather than waiting out the reservation.
    default: "${var.app_name}-lakebase"

  lakebase_pg_version:
    description: Postgres major version for the Lakebase Autoscaling project.
    default: 17

  # DABs YAML has no conditionals, and a target cannot remove a top-level resource
  # or a list item (setting it to null/{}, or overriding it under a target, is
  # ignored). The only working mechanism is the complex-variable splice below: the
  # resource blocks are assigned wholesale from `type: complex` variables whose
  # defaults reproduce the inline config (Lakebase ON), and the `nolakebase` target
  # overrides those variables with the trimmed values. String ${var...} and
  # ${resources...} references resolve inside complex-variable values.
  lakebase_project:
    type: complex
    description: |
      Spliced into resources.postgres_projects. The default is the Lakebase Autoscaling
      project; the `nolakebase` target overrides it with {} so no Postgres is
      provisioned and no PG* env is injected (the chat UI then runs in its Ephemeral,
      no-persistence mode).
    default:
      # The project creates its production branch and primary endpoint implicitly, and
      # the bundle leaves both alone. Compute settings — the autoscaling range and the
      # scale-to-zero timeout — are fixed on some tiers (Free Edition among them), which
      # reject every write to them and fail the deploy. Tune them per workspace with
      # `databricks postgres update-endpoint` or the Lakebase UI.
      chatbot_lakebase_project:
        project_id: ${var.lakebase_project_id}
        display_name: ${var.lakebase_project_id}
        pg_version: ${var.lakebase_pg_version}
        history_retention_duration: "604800s"
        lifecycle:
          prevent_destroy: false

  app_resources:
    type: complex
    description: |
      Spliced into the app's `resources:` list. The default is today's list including
      the `database` Postgres entry; the `nolakebase` target overrides it with the same
      list minus that entry, so the app never receives PG* env.
    default:
      # The setup script creates this UC-backed experiment. DAB binds it to the app
      # and passes its id through the "experiment" value_from reference above.
      - name: 'experiment'
        experiment:
          experiment_id: ${var.experiment_id}
          permission: 'CAN_MANAGE'

      - name: 'trace-warehouse'
        sql_warehouse:
          id: ${var.sql_warehouse_id}
          permission: 'CAN_USE'

      # MODIFY includes SELECT for tables. Declaring them as app resources also
      # grants USE_CATALOG and USE_SCHEMA automatically.
      - name: 'trace-spans-modify'
        uc_securable:
          securable_type: TABLE
          securable_full_name: "${var.trace_catalog}.${var.trace_schema}.${var.trace_table_prefix}_otel_spans"
          permission: MODIFY
      - name: 'trace-annotations-modify'
        uc_securable:
          securable_type: TABLE
          securable_full_name: "${var.trace_catalog}.${var.trace_schema}.${var.trace_table_prefix}_otel_annotations"
          permission: MODIFY
      - name: 'trace-logs-modify'
        uc_securable:
          securable_type: TABLE
          securable_full_name: "${var.trace_catalog}.${var.trace_schema}.${var.trace_table_prefix}_otel_logs"
          permission: MODIFY
      - name: 'trace-metrics-modify'
        uc_securable:
          securable_type: TABLE
          securable_full_name: "${var.trace_catalog}.${var.trace_schema}.${var.trace_table_prefix}_otel_metrics"
          permission: MODIFY

      # Persistent agent memory. As the app's first Postgres resource this makes
      # Databricks inject PGHOST/PGUSER/PGDATABASE/PGPORT/PGSSLMODE into the app.
      - name: 'database'
        postgres:
          branch: "${resources.postgres_projects.chatbot_lakebase_project.name}/branches/production"
          database: "${resources.postgres_projects.chatbot_lakebase_project.name}/branches/production/databases/databricks-postgres"
          permission: CAN_CONNECT_AND_CREATE

resources:
  # Both blocks below are spliced from complex variables — see the `lakebase_project`
  # and `app_resources` variable definitions above. Their defaults reproduce the
  # previously inline configuration, so every target other than `nolakebase` deploys
  # exactly what it did before.
  postgres_projects: ${var.lakebase_project}

  apps:
    databricks_agent_chat_app:
      name: ${var.app_name}
      description: "Databricks agent with web search, Genie, and AI Search, with a chat UI"
      source_code_path: ./
      lifecycle:
        started: true

      # The agent calls the Genie MCP server with the signed-in user's token
      # (see get_user_workspace_client), which needs this scope to be forwarded.
      user_api_scopes:
        - "mcp.genie"
        # Forwarded user token for the AI Search (vector search) managed MCP server
        # at /api/2.0/mcp/ai-search/... (see AI_SEARCH_MCP_PATH_PREFIX in agent.py).
        # Workspaces on the older naming use "vector-search" instead — change this
        # and the path prefix together.
        - "vector-search"
        # Forwarded user token for system.ai.web_search when hosted search is
        # unavailable (cross-region processing disabled, HIPAA, Claude, …).
        - "ai-gateway"

      config:
        command: ["uv", "run", "start-app"]
        env:
          - name: MLFLOW_TRACKING_URI
            value: "databricks"
          - name: MLFLOW_REGISTRY_URI
            value: "databricks-uc"
          - name: API_PROXY
            value: "http://localhost:8000/invocations"
          - name: CHAT_APP_PORT
            value: "3000"
          - name: CHAT_PROXY_TIMEOUT_SECONDS
            value: "300"
          - name: MLFLOW_EXPERIMENT_ID
            value_from: "experiment"
          # Table-prefix destinations cannot be carried in MLFLOW_TRACING_DESTINATION
          # (catalog.schema only). start_server.py reads these and calls
          # mlflow.set_experiment(..., trace_location=UnityCatalog(...)).
          - name: TRACE_CATALOG
            value: ${var.trace_catalog}
          - name: TRACE_SCHEMA
            value: ${var.trace_schema}
          - name: TRACE_TABLE_PREFIX
            value: ${var.trace_table_prefix}
          - name: MLFLOW_TRACING_SQL_WAREHOUSE_ID
            value: ${var.sql_warehouse_id}
          - name: GENIE_SPACE_IDS
            value: ${var.genie_space_ids}
          - name: AI_SEARCH_INDEXES
            value: ${var.ai_search_indexes}
          - name: AGENT_MODEL
            value: ${var.agent_model}

      # Spliced from the `app_resources` complex variable. Its default includes the
      # `database` Postgres entry; the `nolakebase` target trims that entry so the app
      # deploys without Postgres and the chat UI runs in Ephemeral (no persistence) mode.
      resources: ${var.app_resources}

targets:
  dev:
    mode: development
    default: true
    # workspace:
    #   host: https://...

  # Deploys the app WITHOUT Lakebase and WITHOUT Unity Catalog trace storage:
  # no Postgres project is provisioned, no PG* env is injected, and the vendored chat
  # UI auto-detects that absence and runs in its Ephemeral (no chat persistence) mode.
  # Traces go to the experiment's own MLflow-managed storage: `setup-mlflow-experiment
  # --target nolakebase` creates the experiment without a UC trace location and writes
  # EMPTY-STRING overrides for the default-less trace_catalog/trace_schema/
  # trace_table_prefix/sql_warehouse_id variables, so the deploy still satisfies them.
  # start_server.py then skips the UC trace location for the empty values. DABs YAML
  # has no conditionals and a target cannot remove a resource or list item, so this
  # works by overriding the two complex variables that splice the Lakebase project and
  # the app's resource list — see their definitions under `variables:`. Targets do not
  # inherit from each other, so this target repeats the same workspace/mode shape as
  # its siblings. Chat history here is ephemeral; use `dev`/`prod` when persistence or
  # UC trace tables matter. Do NOT switch a target that already deployed Lakebase to
  # this one: a resource vanishing from a target's config makes the next deploy delete
  # the deployed project (and its chat history) — `nolakebase` is its own target from
  # the start.
  nolakebase:
    mode: development
    # workspace:
    #   host: https://...
    variables:
      lakebase_project: {}
      # Only the experiment — no trace SQL warehouse, no trace-table grants, no
      # Postgres. The app env still injects TRACE_*=${var.trace_*}, which resolve to
      # the empty strings the setup script wrote, so no UC trace location is used.
      app_resources:
        - name: 'experiment'
          experiment:
            experiment_id: ${var.experiment_id}
            permission: 'CAN_MANAGE'

  test:
    mode: development
    # workspace:
    #   host: https://...

  test2:
    mode: development
    # workspace:
    #   host: https://...

  test3:
    mode: development
    # workspace:
    #   host: https://...
    
  prod:
    mode: production
    # workspace:
    #   host: https://...
