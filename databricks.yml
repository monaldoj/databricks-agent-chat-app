bundle:
  name: responses-agent-chat-app

# The chat UI is vendored under e2e-chatbot-app-next/ and rebuilt in the app
# container by `start-app`, so its installed and compiled output stays local.
sync:
  exclude:
    - "**/node_modules"
    - "**/dist"
    - "**/.venv"
    - "**/test-results"
    - "**/__pycache__"

resources:
  apps:
    responses_agent_chat_app:
      name: "responses-agent-chat-app"
      description: "Responses agent with web search and Genie, with a chat UI"
      source_code_path: ./

      # The agent calls the Genie MCP server with the signed-in user's token
      # (see get_user_workspace_client), which needs this scope to be forwarded.
      user_api_scopes:
        - "mcp.genie"
      config:
        command: ["uv", "run", "start-app"]
        env:
          - name: MLFLOW_TRACKING_URI
            value: "databricks"
          - name: MLFLOW_REGISTRY_URI
            value: "databricks-uc"
          - name: API_PROXY
            value: "http://localhost:8000/invocations"
          - name: CHAT_APP_PORT
            value: "3000"
          - name: CHAT_PROXY_TIMEOUT_SECONDS
            value: "300"
          - name: MLFLOW_EXPERIMENT_ID
            value_from: "experiment"

      # Resources which this app has access to
      resources:
        - name: 'experiment'
          experiment:
            experiment_id: "1386037587619529"
            permission: 'CAN_MANAGE'

        # Both names are capped at 30 characters by the Apps API.
        - name: 'genie-campus-card-swipe'
          genie_space:
            name: 'Campus Card Swipe Analytics'
            space_id: '01f169d6d34a1233bb6d5ab580b58495'
            permission: 'CAN_RUN'

targets:
  dev:
    mode: development
    default: true
    # workspace:
    #   host: https://...

  prod:
    mode: production
    # workspace:
    #   host: https://...
    resources:
      apps:
        responses_agent_chat_app:
          name: responses-agent-chat-app
